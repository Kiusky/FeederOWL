<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Nuvem</title>
  <link rel="icon" href="https://feederowl.com/img/icons/Driver%20OWL.ico" type="image/png">
  <link rel="stylesheet" href="nuvem.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline src="https://feederowl.com/vid/feederowl/fundo.webm" disablePictureInPicture></video>

<video 
    id="topVideo" 
    autoplay muted loop playsinline 
    src="https://feederowl.com/vid/feederowl/fundo%20animado.webm"
    disablePictureInPicture
></video>

<div id="controls">
  <div id="leftControls">
    <button onclick="goBack()">⬅ Voltar</button>
    <button id="listLinksBtn" style="display:none;">Listar links</button>
    <button id="generateM3uBtn" style="display:none;" onclick="generateM3u()">🎵 Gerar M3U</button>
    <button id="openPlayerBtn" style="display:none;" onclick="openPlayer()">
      <i class="fas fa-bolt"></i> Winamp
    </button>
  </div>

  <div id="rightControls">
    <button id="toggleFolderBtn">Criar Pasta</button>
    <div id="newFolderContainer">
      <input type="text" id="newFolder" placeholder="Nome da pasta">
      <button id="confirmFolderBtn"><i class="fa-solid fa-check"></i></button>
    </div>
    
    <div id="fileInputWrapper">
      <label for="fileInput" id="fileLabel">
        <i class="fas fa-folder-open"></i> Escolher Arquivos
      </label>
      <input type="file" id="fileInput" multiple>
    </div>
    
    <button id="uploadBtn" style="display:none;" onclick="upload()">
      <i class="fas fa-upload"></i> <span id="uploadBtnText">Enviar</span>
    </button>
  </div>
</div>

<textarea id="linksBox"></textarea>
<p id="status"></p>
<hr>

<div id="fileListContainer">
  <ul id="fileList"></ul>
</div>

<div id="toast" class="toast"></div>

<div id="confirmModal" class="modal">
  <div class="modal-content">
    <p id="confirmMessage"></p>
    <div class="modal-buttons">
      <button id="confirmYes">Sim</button>
      <button id="confirmNo">Não</button>
    </div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p id="loadingMessage">Carregando...</p>
  <p id="currentFileUpload" style="font-size: 1rem; margin-top: 10px; color: #ccc;"></p>
</div>

<div id="floatingPlayer" class="floating-player" style="display:none;">
  <div class="player-header-drag">
    <span><i class="fas fa-bolt"></i> Winamp</span>
    <div>
      <button id="minimizePlayerBtn" class="player-window-btn" title="Minimizar">─</button>
      <button id="maximizePlayerBtn" class="player-window-btn" title="Maximizar">⤢</button>
      <button id="closePlayerBtn" class="player-window-btn" title="Fechar">✕</button>
    </div>
  </div>
  <div class="player-content">
    <div id="playerContent"></div>
  </div>
</div>

<script src="nuvem.js"></script>
</body>
</html>
